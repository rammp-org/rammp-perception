# YOLOE-26s on DLA core 0: frees the GPU (about 2% GPU at 10 Hz on abra) at about 98 ms per frame.
# The detection head still falls back to the GPU. dla1 runs it on the other core, e.g. for a second camera.
# The first start builds a TensorRT engine into the volume (about 2 minutes); later starts reuse it.
id: scene_segmenter_yoloe_dla
implements: scene_segmenter
tier: experimental
kind: docker
container:
  image: ghcr.io/rammp-org/rammp-perception/yoloe:main   # pin a release tag in a deployment
  runtime: nvidia
  network_mode: host
  ipc: host
  user: "1000:1000"
  volumes:
    - rammp_perception_engines:/cache/engines
  environment:
    ROS_DOMAIN_ID: "0"
    HOME: /tmp
params:
  model: yoloe-26s-seg
  device: dla0
  image_topic: /scene_camera/color/image_raw
  frame_stride: 3   # every 3rd camera frame: 10 Hz from the 30 fps scene camera
  # BoT-SORT camera-motion compensation costs ~14 ms of CPU per frame: off, the DLA path runs ~9.5 Hz instead
  # of ~8.4 Hz. Turn it back on (sparseOptFlow) if ids break while the chair moves.
  gmc_method: none
publishes: [/perception/object_detections, /perception/scene_segmenter/overlay/compressed]
subscribes: [/scene_camera/color/image_raw]
