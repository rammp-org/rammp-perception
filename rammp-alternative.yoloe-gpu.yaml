# YOLOE-26m on the GPU: the best YOLOE masks, about 30 ms per frame and 12% GPU at 10 Hz on abra.
# The first start builds a TensorRT engine into the volume (about 9 minutes); later starts reuse it.
# Same topics as every other scene_segmenter alternative, so they swap without touching consumers.
id: scene_segmenter_yoloe_gpu
implements: scene_segmenter
tier: experimental
kind: docker
container:
  image: ghcr.io/rammp-org/rammp-perception/yoloe:main   # pin a release tag in a deployment
  runtime: nvidia
  network_mode: host
  ipc: host
  user: "1000:1000"
  volumes:
    - rammp_perception_engines:/cache/engines
  environment:
    ROS_DOMAIN_ID: "0"
    HOME: /tmp
params:
  model: yoloe-26m-seg
  device: gpu
  image_topic: /scene_camera/color/image_raw
  rate_hz: 10.0
publishes: [/scene_segmenter/instances, /scene_segmenter/detections, /scene_segmenter/overlay/compressed]
subscribes: [/scene_camera/color/image_raw]
