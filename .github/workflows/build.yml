name: Build and Publish

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # rammp-interfaces-ros2 ref that carries rammp_perception_interfaces. A branch, not a release, until
  # interfaces tags one: these are test images.
  INTERFACES_REF: dev

jobs:
  fragment:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install pyyaml pytest numpy

      - name: Unit tests
        run: |
          pytest tests -v
          (cd object_detection/common/rammp_detection_common && python -m pytest test -v)
          (cd object_detection/sam3/rammp_sam3 && python -m pytest test -v)
          (cd object_detection/boxer/rammp_boxer && python -m pytest test -v)

      - name: Validate the fragments
        run: python3 scripts/validate_fragment.py rammp-alternative*.yaml

  image:
    needs: fragment
    # Native arm64: GitHub's hosted arm runner, free for public repos. rammp-cuda is arm64 only.
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yoloe
            smoke: true
          - image: rfdetr
            smoke: true
          # Needs a GPU and gated weights to run at all; the Dockerfile's import check is its test.
          - image: sam3
            smoke: false
          # Needs a GPU and a camera stream to do anything; the Dockerfile's import check is its test.
          - image: boxer
            smoke: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repo
        name: Compute lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: object_detection/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          build-args: INTERFACES_REF=${{ env.INTERFACES_REF }}
          load: true
          tags: |
            rammp-perception-${{ matrix.image }}:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publishes, and exits on SIGTERM
        if: matrix.smoke
        run: ./scripts/smoke.sh rammp-perception-${{ matrix.image }}:ci

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -n1 docker push
