name: Build and Publish

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # rammp-interfaces-ros2 release that carries rammp_perception_interfaces: the one rammp-cuda:2.2.0-jp6
  # compiles in, so the images' overlay matches the base's copy.
  INTERFACES_REF: v2.1.0

jobs:
  fragment:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install pyyaml pytest numpy scipy

      - name: Unit tests
        run: |
          pytest tests -v
          (cd object_detection/common/rammp_detection_common && python -m pytest test -v)
          (cd object_detection/sam3/rammp_sam3 && python -m pytest test -v)
          (cd object_detection/boxer/rammp_boxer && python -m pytest test -v)
          (cd object_detection/odom3d/rammp_odom3d && python -m pytest test -v)

      - name: Validate the fragments
        run: python3 scripts/validate_fragment.py rammp-alternative*.yaml

  image:
    needs: fragment
    # Native arm64: GitHub's hosted arm runner, free for public repos. rammp-cuda is arm64 only.
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yoloe
            smoke: true
          - image: rfdetr
            smoke: true
          # Needs a GPU to run at all; the Dockerfile's import check is its test. Bakes in the gated weights,
          # downloaded with the HF_TOKEN secret (an account that accepted the SAM License); keep its package private.
          - image: sam3
            smoke: false
          # Needs a GPU and a camera stream to do anything; the Dockerfile's import check is its test.
          - image: boxer
            smoke: false
          # Needs detections, depth and TF to do anything; the Dockerfile's import check and unit tests are its test.
          - image: odom3d
            smoke: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repo
        name: Compute lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: object_detection/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          build-args: INTERFACES_REF=${{ env.INTERFACES_REF }}
          # Only sam3 mounts it; the other Dockerfiles never see it.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          # Registry cache, so unchanged layers (sam3's 3.3 GB weights) keep their digests and hosts don't re-pull
          # them. It lives in the image's own package (sam3's stays private). PR runs aren't logged in: no cache.
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache', steps.repo.outputs.name, matrix.image) || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', steps.repo.outputs.name, matrix.image) || '' }}
          load: true
          tags: |
            rammp-perception-${{ matrix.image }}:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publishes, and exits on SIGTERM
        if: matrix.smoke
        run: ./scripts/smoke.sh rammp-perception-${{ matrix.image }}:ci

      # Same build, all cached: buildx pushes the cached layer blobs as they are, so their digests carry over.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: object_detection/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          build-args: INTERFACES_REF=${{ env.INTERFACES_REF }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
